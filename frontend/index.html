<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<title>AI-OTT</title>
<meta name="viewport" content="width=device-width, initial-scale=1.0">

<style>
body {
    margin: 0;
    font-family: Arial, sans-serif;
    background: url('https://images.unsplash.com/photo-1524985069026-dd778a71c7b4') no-repeat center center fixed;
    background-size: cover;
    color: white;
}

.overlay {
    background: rgba(0,0,0,0.88);
    min-height: 100vh;
}

header {
    display: flex;
    justify-content: space-between;
    align-items: center;
    padding: 20px 40px;
}

html {
    scroll-behavior: smooth;
}

.logo {
    font-size: 30px;
    font-weight: bold;
    color: red;
}

nav a {
    color: white;
    margin-left: 25px;
    text-decoration: none;
}

nav a:hover {
    color: red;
}

.hero {
    padding: 60px 40px 20px 40px;
}

.section {
    padding: 40px;
}

button {
    padding: 10px 20px;
    background: red;
    color: white;
    border: none;
    cursor: pointer;
    border-radius: 6px;
    margin-left: 10px;
}

video {
    border-radius: 12px;
    border: 2px solid red;
    margin-top: 15px;
}

#emotionText {
    margin-top: 10px;
    font-size: 18px;
    color: #00ffcc;
}

#recommended-container {
    display: flex;
    flex-wrap: wrap;
    gap: 20px;
    margin-top: 20px;
}

.movie-card {
    width: 250px;
    background: rgba(255,255,255,0.1);
    padding: 15px;
    border-radius: 12px;
}
</style>
</head>

<body>

<div class="overlay">

<header>
    <div class="logo">AI-OTT</div>
   <nav>
    <a href="#home">Home</a>
    <a href="#movies">Movies</a>
    <a href="#mylist">My List</a>
    <a href="#profile">Profile</a>
</nav>
</header>

<div class="hero">
    <h1>Smart Movie Recommendations Powered by AI</h1>
    <p>Emotion detected directly from your face using CNN.</p>
</div>

<div class="section">

    <h2>🎥 Real-Time Emotion Detection</h2>
    <video id="webcam" width="400" height="300" autoplay muted></video>
    <br>
    <button id="startCamBtn">Start Webcam</button>
    <button id="generateBtn">Generate Recommendations</button>

    <div id="emotionText">Click Start Webcam</div>

    <h2 style="margin-top:40px;">Recommended For You</h2>
    <div id="recommended-container"></div>

</div>

</div>

<script>
document.addEventListener("DOMContentLoaded", function () {

    const TMDB_API_KEY = "c0d5c6883a54753840701fb38f857f8b";

const video = document.getElementById("webcam");
const emotionText = document.getElementById("emotionText");
const startBtn = document.getElementById("startCamBtn");
const generateBtn = document.getElementById("generateBtn");
const container = document.getElementById("recommended-container");

async function fetchPoster(movieTitle) {
    try {
        const url = `https://api.themoviedb.org/3/search/movie?api_key=${TMDB_API_KEY}&query=${encodeURIComponent(movieTitle)}`;
        const response = await fetch(url);
        const data = await response.json();

        if (data.results && data.results.length > 0) {
            const posterPath = data.results[0].poster_path;
            if (posterPath) {
                return `https://image.tmdb.org/t/p/w500${posterPath}`;
            }
        }
    } catch (error) {
        console.error("Poster fetch error:", error);
    }

    return "https://via.placeholder.com/300x450?text=No+Image";
}

/* START WEBCAM */
startBtn.addEventListener("click", async () => {
    try {
        const stream = await navigator.mediaDevices.getUserMedia({ video: true });
        video.srcObject = stream;
        await video.play();
        emotionText.innerText = "Webcam Started ✔";
    } catch (err) {
        emotionText.innerText = "Camera access denied.";
        console.error(err);
    }
});

/* GENERATE AI RECOMMENDATIONS */
generateBtn.addEventListener("click", async () => {

    if (!video.srcObject) {
        alert("Please start webcam first!");
        return;
    }

    emotionText.innerText = "Detecting emotion...";

    const canvas = document.createElement("canvas");
    const context = canvas.getContext("2d");

    canvas.width = video.videoWidth;
    canvas.height = video.videoHeight;
    context.drawImage(video, 0, 0);

    const imageData = canvas.toDataURL("image/jpeg");

    try {
        const response = await fetch("http://127.0.0.1:8000/recommend", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({
                user_id: 1,
                seed_movie_id: 1,
                image: imageData,
                top_k: 10
            })
        });

        const result = await response.json();

        emotionText.innerText = "Detected Mood: " + result.detected_mood;

        displayMovies(result.recommendations);

    } catch (error) {
        console.error(error);
        emotionText.innerText = "Backend connection error.";
    }
});

/* DISPLAY MOVIES */
async function displayMovies(movieList) {

    container.innerHTML = "";

    for (let movie of movieList) {

        const posterUrl = await fetchPoster( movie.title.replace(/\(\d{4}\)/, "").trim());

        container.innerHTML += `
            <div class="movie-card">
                <img src="${posterUrl}" style="width:100%; border-radius:10px;">
                <h3>${movie.title}</h3>
                <p><b>Genres:</b> ${movie.genres}</p>
                <p>${movie.explanation}</p>
            </div>
        `;
    }
}

});
</script>

</body>
</html>
